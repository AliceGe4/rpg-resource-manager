<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Resource Organizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button data-modal-target="#new-item-modal">New Resource Item</button> <!--data-modal-target needs to be specific to every button-->
    <div class="modal" id="new-item-modal">
        <div class="modal-header">
            <div class="title">Input New Crafting Item</div>
            <button data-close-button class="close-button">&times;</button> <!--Times always scales the button-->
        </div>
        <div class="modal-body">
            <label for="item-name">Item Name:</label>
            <input type="text" id="item-name">
            <br>
            <div class ="resource-picker"> <!--Template for selecting resources, expand on this when making recipe with number of resources-->
                <label for="resourceSelect">Select Resource:</label>

                <select id="resourceSelect"></select>
                <button type="button" id="addResource">
                    + Add
                </button>

                <div id="selectedResources"></div>

            </div>

            <br>
            <input type="submit" id="resource-submit">
            <p id="resource-success" class="success-message">
                Item saved successfully!
            </p>

        </div>
    </div>

     <button data-modal-target="#resource-table-modal">Table Of Resources</button> <!--data-modal-target needs to be specific to every button-->
    <div class="modal table-modal" id="resource-table-modal">
        <div class="modal-header">
    <div class="title">Table Of Resources:</div>

    <div class="modal-header-actions">
        <button data-modal-target="#new-item-modal">
            + Add Item
        </button>

                <button data-close-button class="close-button">
                &times;
                </button>
            </div>
        </div>
        <div class="modal-body">
            <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Resource Name</th>
                        <th>Ingredients</th> 
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="resTable">
                </tbody>
            </table>
            </div>
        </div>
    </div>

    <br>

    <button data-modal-target="#recipe-table-modal">
    Table of Recipes
</button>

<div class="modal table-modal" id="recipe-table-modal">

    <div class="modal-header">
        <div class="title">Table of Recipes:</div>

        <div class="modal-header-actions">
            <button type="button" data-modal-target="#new-recipe-modal">
                + Add Recipe
            </button>

            <button data-close-button class="close-button">
                &times;
            </button>
        </div>
    </div>

    <div class="modal-body">
        <div class="table-container">
            <table class="data-table recipe-data-table">
                <thead>
                    <tr>
                        <th>Recipe Name</th>
                        <th>Ingredients</th>
                        <th>Info</th>
                        <th>Crafted</th>
                        <th>Craftable</th>
                    </tr>
                </thead>

                <tbody id="recipeTable">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal" id="recipe-info-modal">

    <div class="modal-header">
        <div class="title" id="recipe-info-title">
            Recipe Information
        </div>

        <button data-close-button class="close-button">
            &times;
        </button>
    </div>

    <div class="modal-body">

        <p id="recipe-info-description"></p>

        <div class="recipe-info-actions">
            <button type="button" id="recipe-edit-button">
                Edit
            </button>

            <button type="button" id="recipe-delete-button">
                Delete
            </button>
        </div>

    </div>
</div>

   <div class="modal recipe-form-modal" id="new-recipe-modal">
    <div class="modal-header">
        <div class="title">Input New Recipe</div>
        <button data-close-button class="close-button">&times;</button>
    </div>

    <div class="modal-body">

        <!-- Recipe name -->
        <div class="recipe-field">
            <label for="recipe-name">Recipe Name:</label>
            <input type="text" id="recipe-name">
        </div>

        <!-- Ingredients -->
        <div class="recipe-field">
            <label for="recipe-resource-select">Ingredients:</label>

            <div class="recipe-ingredient-row">
                <select id="recipe-resource-select"></select>

                <input type="number" id="recipe-quantity"
                       min="1" step="1" value="1">

                <button type="button" id="recipe-add-resource">
                    + Add
                </button>
            </div>

            <div id="recipe-selected-ingredients"></div>
        </div>

        <!-- Description -->
        <div class="recipe-field">
            <label for="recipe-description">Description:</label>
            <textarea id="recipe-description" rows="4"></textarea>
        </div>

        <!-- Crafted -->
        <div class="recipe-field">
            <label>
                <input type="checkbox" id="recipe-crafted">
                Already crafted
            </label>
        </div>

        <button type="button" id="recipe-submit">
            Submit Recipe
        </button>

    </div>
</div>
    <div id="overlay"></div>
    <h1 id ="myH1"></h1>
    <p style ="font-size: 7px" id ="myP"></p>
    <script src="index.js"></script>
</body>
</html>
